<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive Photo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>

  <!-- Main display container -->
  <div id="image">
    Hover over an image below to display here.
  </div>

  <!-- Gallery thumbnails -->
  <div class="gallery">
    <img class="preview" 
         alt="Stylized blue galaxy artwork" 
         src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=900&q=80" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">

    <img class="preview" 
         alt="Blooming pink lotus flower" 
         src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=900&q=80" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">

    <img class="preview" 
         alt="Misty mountain landscape" 
         src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" 
         onmouseover="upDate(this)" 
         onmouseout="unDo()">
  </div>

</body>
</html>
